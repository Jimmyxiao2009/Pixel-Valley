services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pixel
      POSTGRES_PASSWORD: pixel
      POSTGRES_DB: pixel_valley
    ports:
      - "5432:5432"
    volumes:
      - pixel_valley_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixel -d pixel_valley"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pixel_valley_pg:
